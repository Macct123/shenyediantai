<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#05080c" />
<title>深夜电台 · Midnight Signal</title>
<link rel="stylesheet" href="styles.css?v=20261030e" />
</head>
<body>
<noscript><p class="noscript">本作需要开启 JavaScript 才能守夜。</p></noscript>

<div id="app">

  <!-- 转场黑幕 -->
  <div id="fade" class="fade" aria-hidden="true"></div>

  <!-- 章节卡 -->
  <div id="chapter" class="chapter" hidden aria-hidden="true">
    <div class="chapter-inner">
      <p class="chapter-no" id="chapterNo">序章</p>
      <h2 class="chapter-name" id="chapterName">空频</h2>
      <span class="chapter-rule" aria-hidden="true"></span>
      <p class="chapter-sub" id="chapterSub">MIDNIGHT SIGNAL</p>
    </div>
  </div>

  <!-- ==================== 开篇 ==================== -->
  <div id="intro" class="intro" aria-hidden="true">
    <div class="intro-cam" id="introCam"></div>
    <canvas id="introCanvas" class="intro-video" aria-hidden="true"></canvas>
    <canvas id="introRain" class="intro-rain"></canvas>
    <div class="intro-veil"></div>

    <div class="intro-text">
      <h1>深夜电台</h1>
      <span class="intro-rule"></span>
      <p>MIDNIGHT&nbsp;&nbsp;SIGNAL</p>
    </div>

    <p class="intro-hint">轻触继续</p>
  </div>

  <!-- ==================== 主页 ==================== -->
  <section id="menu" class="screen is-active" aria-label="游戏主页">
    <div class="menu-art" aria-hidden="true"></div>
    <div class="menu-veil" aria-hidden="true"></div>

    <div class="menu-head">
      <h1 class="menu-title">深夜电台</h1>
      <p class="menu-sub">MIDNIGHT&nbsp;SIGNAL</p>
      <p class="menu-status" id="menuStatus"></p>
    </div>

    <nav class="menu-entries" aria-label="主页入口">
      <button class="obj" id="entryStart" data-action="start">
        <span class="obj-dot" aria-hidden="true"></span>
        <span class="obj-label" id="entryStartLabel">开始新游戏</span>
      </button>
      <button class="obj" id="entryRestart" data-action="restart" hidden>
        <span class="obj-dot" aria-hidden="true"></span>
        <span class="obj-label">重新开始</span>
      </button>
      <button class="obj" data-action="tapes">
        <span class="obj-dot" aria-hidden="true"></span>
        <span class="obj-label">录音带柜</span>
      </button>
      <button class="obj" data-action="settings">
        <span class="obj-dot" aria-hidden="true"></span>
        <span class="obj-label">设置</span>
      </button>
      <button class="obj" data-action="credits">
        <span class="obj-dot" aria-hidden="true"></span>
        <span class="obj-label">制作名单</span>
      </button>
    </nav>

    <p class="menu-hint" id="menuHint">点击亮着的那盏灯，开始今晚的守夜</p>
  </section>

  <!-- ==================== 游戏 ==================== -->
  <section id="game" class="screen" aria-label="广播室">
    <header id="topbar">
      <span class="tb-title">深夜电台</span>
      <span class="tb-sep" aria-hidden="true">·</span>
      <span class="tb-night" id="tbNight">序章 · 空频</span>
      <span class="tb-spacer"></span>
      <button class="tb-btn" id="btnLog" title="通话记录">记录</button>
      <button class="tb-btn" id="btnMenu" title="返回菜单">菜单</button>
      <button class="tb-btn" id="btnMute" aria-pressed="false" title="静音开关">静音</button>
    </header>

    <div id="viewport">
      <div id="stage">
        <div class="layer layer-back" data-factor="0.4">
          <div class="scene-frame"><div class="scene-art" id="sceneArt"></div></div>
        </div>
        <div class="layer layer-mid" data-factor="0.8">
          <canvas id="fog" aria-hidden="true"></canvas>
        </div>
        <div class="layer layer-front" data-factor="1.2">
          <div class="scene-frame">
            <div class="ambient" id="ambient" aria-hidden="true">
              <div class="amb-lamp"></div>
              <div class="amb-rain"></div>
              <div class="amb-sweep"></div>
              <div class="amb-dust"></div>
            </div>
            <div id="lights" aria-hidden="true"></div>
            <div id="hotspots"></div>
          </div>
        </div>

        <!-- 特写视图 -->
        <div id="closeup" class="closeup" hidden role="dialog" aria-modal="true" aria-label="物品特写">
          <div class="closeup-art" id="closeupArt" aria-hidden="true">
            <div class="closeup-bg" id="closeupBg"></div>
            <div class="closeup-stage" id="closeupStage">
              <div class="closeup-shot" id="closeupShot"></div>
              <div class="closeup-text" id="closeupText"></div>
            </div>
            <div class="closeup-sheen" id="closeupSheen"></div>
            <div class="closeup-fg" aria-hidden="true"></div>
          </div>
          <div class="closeup-tools" id="closeupTools"></div>
          <p class="closeup-title" id="closeupTitle"></p>
          <button class="closeup-back" id="closeupBack">返回</button>
        </div>

        <!-- 对白（点击推进 / 逐字出现） -->
        <div id="dialogue" class="dialogue" hidden role="button" tabindex="0" aria-label="对白，点击继续">
          <p class="dlg-speaker" id="dlgSpeaker" hidden></p>
          <p class="dlg-text" id="dlgText"></p>
          <span class="dlg-next" id="dlgNext" aria-hidden="true">▾</span>
        </div>

        <!-- 当前所在房间 -->
        <p class="room-tag" id="roomTag" aria-live="polite"></p>

        <!-- 随身物品 -->
        <div class="inventory" id="inventory" hidden aria-label="随身物品"></div>
      </div>

      <aside id="info">
        <p class="info-objective" id="objective"></p>
        <div class="info-foot">
          <span class="onair"><i aria-hidden="true"></i>ON AIR</span>
          <span class="info-tapes" id="infoTapes">收录 0 盘</span>
        </div>
      </aside>
    </div>
  </section>

  <!-- ==================== 弹层 ==================== -->
  <div class="modal" id="modalTapes" hidden role="dialog" aria-modal="true" aria-label="录音带柜">
    <div class="modal-card">
      <h2>录音带柜</h2>
      <div class="tape-list" id="tapeList"></div>
      <button class="btn-ghost modal-close" data-close="modalTapes">收起柜门</button>
    </div>
  </div>

  <div class="modal" id="modalLog" hidden role="dialog" aria-modal="true" aria-label="通话记录">
    <div class="modal-card modal-card-log">
      <h2>通话记录</h2>
      <p class="modal-note">点一句话可以重听。坐标、频道、方位都记在这里。</p>
      <div class="call-log" id="callLog"></div>
      <button class="btn-ghost modal-close" data-close="modalLog">收起记录</button>
    </div>
  </div>

  <div class="modal" id="modalSettings" hidden role="dialog" aria-modal="true" aria-label="设置">
    <div class="modal-card">
      <h2>设置</h2>
      <label class="row">
        <span>总静音</span>
        <input type="checkbox" id="setMute" />
      </label>
      <p class="modal-note">静音后依然可以通关：所有声音信息都有文字与波形通道。</p>
      <button class="btn-ghost modal-close" data-close="modalSettings">关闭</button>
    </div>
  </div>

  <div class="modal" id="modalCredits" hidden role="dialog" aria-modal="true" aria-label="制作名单">
    <div class="modal-card">
      <h2>制作名单</h2>
      <p class="modal-note">《深夜电台 · Midnight Signal》</p>
      <p class="modal-note">一个关于未竟心事的中继站。</p>
      <button class="btn-ghost modal-close" data-close="modalCredits">关闭</button>
    </div>
  </div>

  <div class="modal" id="modalRestart" hidden role="dialog" aria-modal="true" aria-label="重新开始">
    <div class="modal-card">
      <h2>重新开始</h2>
      <p class="modal-note">守夜进度与收藏的录音带会被一起擦掉。</p>
      <button class="btn-ghost modal-close" id="btnRestartYes">擦掉，重新守夜</button>
      <button class="btn-ghost modal-close" data-close="modalRestart">再想想</button>
    </div>
  </div>

</div>

<script src="game.js?v=20261030e"></script>
</body>
</html>
