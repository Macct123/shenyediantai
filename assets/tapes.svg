<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="none">
  <defs>
    <linearGradient id="wWall" x1="0" y1="0" x2="0.1" y2="1">
      <stop offset="0" stop-color="#0b1824"/>
      <stop offset="0.45" stop-color="#081420"/>
      <stop offset="1" stop-color="#050b12"/>
    </linearGradient>
    <linearGradient id="wFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1620"/>
      <stop offset="1" stop-color="#04080d"/>
    </linearGradient>
    <linearGradient id="wWood" x1="0" y1="0" x2="0.15" y2="1">
      <stop offset="0" stop-color="#3b2c22"/>
      <stop offset="0.35" stop-color="#241a14"/>
      <stop offset="1" stop-color="#110c09"/>
    </linearGradient>
    <linearGradient id="wMetal" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#4a5f70"/>
      <stop offset="0.45" stop-color="#263745"/>
      <stop offset="1" stop-color="#101c26"/>
    </linearGradient>
    <linearGradient id="wShelf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2732"/>
      <stop offset="1" stop-color="#0a131a"/>
    </linearGradient>
    <linearGradient id="wGlass" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#16324a"/>
      <stop offset="0.55" stop-color="#0d2131"/>
      <stop offset="1" stop-color="#071019"/>
    </linearGradient>
    <radialGradient id="wLamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe3b8" stop-opacity="0.92"/>
      <stop offset="0.28" stop-color="#eeb173" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#e0a45e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="wPool" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd9a4" stop-opacity="0.2"/>
      <stop offset="0.5" stop-color="#e0a45e" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#e0a45e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="wVign" cx="0.5" cy="0.44" r="0.76">
      <stop offset="0.38" stop-color="#000" stop-opacity="0"/>
      <stop offset="0.76" stop-color="#000" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.86"/>
    </radialGradient>
    <pattern id="wRain" width="210" height="420" patternUnits="userSpaceOnUse" patternTransform="rotate(9)">
      <line x1="24" y1="0" x2="24" y2="82" stroke="#cfe4f7" stroke-opacity="0.1" stroke-width="2"/>
      <line x1="96" y1="60" x2="96" y2="132" stroke="#cfe4f7" stroke-opacity="0.07" stroke-width="2"/>
      <line x1="158" y1="180" x2="158" y2="238" stroke="#cfe4f7" stroke-opacity="0.09" stroke-width="2"/>
    </pattern>
  </defs>

  <!-- 墙 -->
  <rect width="1920" height="1080" fill="url(#wWall)"/>
  <!-- 墙板缝隙 -->
  <g stroke="#0e1c28" stroke-width="3" opacity="0.7">
    <line x1="0" y1="300" x2="1920" y2="300"/>
    <line x1="0" y1="640" x2="1920" y2="640"/>
    <line x1="520" y1="0" x2="520" y2="700"/>
    <line x1="1420" y1="0" x2="1420" y2="700"/>
  </g>

  <!-- 地板 -->
  <rect y="880" width="1920" height="200" fill="url(#wFloor)"/>
  <g stroke="#0d1a24" stroke-width="2" opacity="0.55">
    <line x1="0" y1="930" x2="1920" y2="930"/>
    <line x1="0" y1="986" x2="1920" y2="986"/>
    <line x1="0" y1="1040" x2="1920" y2="1040"/>
  </g>

  <!-- 窗 -->
  <g>
    <rect x="1500" y="150" width="330" height="360" fill="url(#wGlass)"/>
    <rect x="1500" y="150" width="330" height="360" fill="url(#wRain)"/>
    <rect x="1500" y="150" width="330" height="360" fill="none" stroke="#22333f" stroke-width="8"/>
    <line x1="1665" y1="150" x2="1665" y2="510" stroke="#22333f" stroke-width="7"/>
    <line x1="1500" y1="330" x2="1830" y2="330" stroke="#22333f" stroke-width="7"/>
    <path d="M1500 470 Q1600 446 1700 470 T1830 462 L1830 510 L1500 510 Z" fill="#0a1b28" opacity="0.85"/>
  </g>

  <!-- 左侧磁带柜 -->
  <g>
    <rect x="90" y="200" width="430" height="560" rx="6" fill="url(#wShelf)" stroke="#1d2c38" stroke-width="3"/>
    <g fill="#0a1319" stroke="#1b2a36" stroke-width="2">
      <rect x="104" y="216" width="402" height="118"/>
      <rect x="104" y="348" width="402" height="118"/>
      <rect x="104" y="480" width="402" height="118"/>
      <rect x="104" y="612" width="402" height="126"/>
    </g>
    <!-- 盘式磁带 -->
    <g fill="#12202b" stroke="#2b4354" stroke-width="2">
      <circle cx="176" cy="274" r="46"/><circle cx="300" cy="274" r="46"/><circle cx="428" cy="274" r="40"/>
      <circle cx="188" cy="406" r="44"/><circle cx="318" cy="406" r="44"/>
    </g>
    <g fill="none" stroke="#31505f" stroke-width="2" opacity="0.75">
      <circle cx="176" cy="274" r="17"/><circle cx="300" cy="274" r="17"/><circle cx="428" cy="274" r="15"/>
      <circle cx="188" cy="406" r="16"/><circle cx="318" cy="406" r="16"/>
    </g>
    <!-- 磁带盒 -->
    <g fill="#152430" stroke="#26404f" stroke-width="2">
      <rect x="136" y="510" width="70" height="76" rx="3"/>
      <rect x="216" y="510" width="70" height="76" rx="3"/>
      <rect x="296" y="510" width="70" height="76" rx="3"/>
      <rect x="376" y="516" width="70" height="70" rx="3"/>
      <rect x="136" y="646" width="70" height="70" rx="3"/>
      <rect x="216" y="646" width="70" height="70" rx="3"/>
    </g>
    <g fill="#e0a45e" opacity="0.32">
      <rect x="148" y="522" width="46" height="7"/>
      <rect x="228" y="522" width="46" height="7"/>
      <rect x="308" y="522" width="46" height="7"/>
      <rect x="148" y="658" width="46" height="7"/>
    </g>
  </g>

  <!-- 吊灯 -->
  <g>
    <line x1="900" y1="0" x2="900" y2="132" stroke="#16242f" stroke-width="5"/>
    <path d="M846 132 L954 132 L930 186 L870 186 Z" fill="#1b2c39" stroke="#2c4353" stroke-width="3"/>
    <ellipse cx="900" cy="186" rx="30" ry="10" fill="#ffd9a4" opacity="0.85"/>
    <circle cx="900" cy="210" r="240" fill="url(#wLamp)" opacity="0.5"/>
  </g>

  <!-- 操作台 -->
  <g>
    <path d="M470 800 L1450 792 L1520 900 L400 908 Z" fill="url(#wWood)"/>
    <path d="M470 800 L1450 792 L1450 812 L470 820 Z" fill="#4b382b" opacity="0.55"/>
    <rect x="400" y="900" width="1120" height="26" fill="#0a0e12"/>
    <ellipse cx="960" cy="852" rx="420" ry="120" fill="url(#wPool)"/>
  </g>

  <!-- 剪接台（左） -->
  <g>
    <rect x="610" y="758" width="330" height="66" rx="6" fill="#1b2a36" stroke="#2f4757" stroke-width="3"/>
    <rect x="624" y="744" width="300" height="20" rx="4" fill="#253847" stroke="#35505f" stroke-width="2"/>
    <!-- 磁带条 -->
    <rect x="636" y="750" width="276" height="7" fill="#3a2c22"/>
    <rect x="636" y="750" width="276" height="3" fill="#5d4634" opacity="0.7"/>
    <!-- 剪断处 -->
    <g stroke="#e0a45e" stroke-width="2" opacity="0.75">
      <line x1="760" y1="744" x2="760" y2="766"/>
      <line x1="852" y1="744" x2="852" y2="766"/>
    </g>
    <!-- 剪刀 -->
    <g stroke="#8ba0b2" stroke-width="3" fill="none" opacity="0.8">
      <path d="M690 790 L736 812"/>
      <path d="M700 812 L742 784"/>
      <circle cx="684" cy="792" r="7"/><circle cx="702" cy="816" r="7"/>
    </g>
    <!-- 铅笔 -->
    <rect x="840" y="788" width="96" height="9" rx="4" fill="#a8452f" opacity="0.85" transform="rotate(-8 888 792)"/>
  </g>

  <!-- 信件 -->
  <g transform="rotate(-6 520 800)">
    <rect x="452" y="768" width="140" height="92" rx="3" fill="#c9bda2" opacity="0.9"/>
    <rect x="452" y="768" width="140" height="92" rx="3" fill="none" stroke="#8d8266" stroke-width="2"/>
    <g stroke="#7c7259" stroke-width="2" opacity="0.55">
      <line x1="466" y1="792" x2="578" y2="792"/>
      <line x1="466" y1="806" x2="560" y2="806"/>
      <line x1="466" y1="820" x2="572" y2="820"/>
    </g>
  </g>

  <!-- 开盘机（右） -->
  <g>
    <rect x="1064" y="610" width="372" height="196" rx="8" fill="url(#wMetal)" stroke="#33505f" stroke-width="3"/>
    <!-- 两个盘 -->
    <circle cx="1136" cy="672" r="52" fill="#101c25" stroke="#3d5b6c" stroke-width="3"/>
    <circle cx="1136" cy="672" r="18" fill="#253947" stroke="#456a7d" stroke-width="2"/>
    <circle cx="1372" cy="672" r="44" fill="#101c25" stroke="#3d5b6c" stroke-width="3"/>
    <circle cx="1372" cy="672" r="15" fill="#253947" stroke="#456a7d" stroke-width="2"/>
    <path d="M1188 672 L1320 672" stroke="#3a2c22" stroke-width="4" opacity="0.9"/>
    <!-- 磁头组 -->
    <rect x="1200" y="700" width="110" height="34" rx="4" fill="#0d1720" stroke="#38505f" stroke-width="2"/>
    <g fill="#6b8496" opacity="0.8">
      <rect x="1212" y="708" width="8" height="18"/>
      <rect x="1236" y="708" width="8" height="18"/>
      <rect x="1260" y="708" width="8" height="18"/>
    </g>
    <!-- 按钮 -->
    <g>
      <rect x="1084" y="752" width="54" height="34" rx="5" fill="#16242e" stroke="#3a5c6d" stroke-width="2"/>
      <rect x="1150" y="752" width="54" height="34" rx="5" fill="#16242e" stroke="#3a5c6d" stroke-width="2"/>
      <rect x="1216" y="752" width="54" height="34" rx="5" fill="#16242e" stroke="#3a5c6d" stroke-width="2"/>
      <circle cx="1111" cy="769" r="6" fill="#e0a45e" opacity="0.8"/>
      <path d="M1177 762 L1177 776 L1186 769 Z" fill="#9fb6c6"/>
      <rect x="1238" y="764" width="12" height="10" fill="#9fb6c6"/>
    </g>
    <!-- VU 表 -->
    <rect x="1290" y="744" width="96" height="46" rx="4" fill="#1a2a20" stroke="#3d5b6c" stroke-width="2"/>
    <path d="M1300 782 Q1338 750 1376 782" fill="none" stroke="#8fa9b8" stroke-width="2" opacity="0.75"/>
    <line x1="1338" y1="780" x2="1352" y2="762" stroke="#e0a45e" stroke-width="2"/>
  </g>

  <!-- 桌上的磁带盒（待拆） -->
  <g>
    <rect x="982" y="782" width="92" height="58" rx="4" fill="#1b2b37" stroke="#3a5666" stroke-width="2"/>
    <rect x="992" y="792" width="72" height="26" rx="2" fill="#0d1720" stroke="#2c4553" stroke-width="2"/>
    <circle cx="1010" cy="805" r="7" fill="#223846" stroke="#3f5f70" stroke-width="2"/>
    <circle cx="1046" cy="805" r="7" fill="#223846" stroke="#3f5f70" stroke-width="2"/>
    <rect x="996" y="824" width="44" height="5" fill="#e0a45e" opacity="0.5"/>
  </g>

  <!-- 暗角 -->
  <rect width="1920" height="1080" fill="url(#wVign)"/>
</svg>
