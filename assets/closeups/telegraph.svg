<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="none">
  <defs>
    <linearGradient id="twall" x1="0" y1="0" x2="0.1" y2="1">
      <stop offset="0" stop-color="#211f1b"/>
      <stop offset="0.5" stop-color="#141311"/>
      <stop offset="1" stop-color="#080807"/>
    </linearGradient>
    <linearGradient id="twood" x1="0" y1="0" x2="0.1" y2="1">
      <stop offset="0" stop-color="#4a3522"/>
      <stop offset="0.45" stop-color="#2c1e13"/>
      <stop offset="1" stop-color="#130c07"/>
    </linearGradient>
    <linearGradient id="tbrass" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#e0be7c"/>
      <stop offset="0.38" stop-color="#a07b3c"/>
      <stop offset="0.72" stop-color="#5d4420"/>
      <stop offset="1" stop-color="#2c1f0d"/>
    </linearGradient>
    <linearGradient id="tsteel" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#6c757b"/>
      <stop offset="0.5" stop-color="#333b40"/>
      <stop offset="1" stop-color="#0e1214"/>
    </linearGradient>
    <radialGradient id="tlamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe6bd" stop-opacity="0.95"/>
      <stop offset="0.3" stop-color="#f0b877" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#e0a45e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tvign" cx="0.5" cy="0.44" r="0.78">
      <stop offset="0.36" stop-color="#000" stop-opacity="0"/>
      <stop offset="0.78" stop-color="#000" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.9"/>
    </radialGradient>
    <filter id="tblur"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="tblurS"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="trough" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.014 0.03" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="8" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="url(#twall)"/>

  <!-- 光晕 -->
  <circle cx="360" cy="250" r="300" fill="url(#tlamp)" opacity="0.35"/>

  <!-- 桌面 -->
  <path d="M-20 470 H1620 V920 H-20 Z" fill="url(#twood)" filter="url(#trough)"/>
  <path d="M-20 470 H1620" stroke="#7a5a36" stroke-width="4" opacity="0.35"/>
  <g stroke="#140d08" stroke-width="3" opacity="0.5">
    <path d="M0 520 Q400 512 800 522 Q1200 532 1600 516"/>
    <path d="M0 610 Q420 604 840 614 Q1240 624 1600 606"/>
    <path d="M0 720 Q460 714 920 724 Q1300 734 1600 718"/>
  </g>

  <!-- 主电键 -->
  <g filter="url(#trough)">
    <rect x="520" y="540" width="520" height="46" rx="6" fill="#0a0f11"/>
    <rect x="528" y="546" width="504" height="34" rx="4" fill="url(#tsteel)"/>
    <rect x="528" y="546" width="504" height="34" rx="4" fill="none" stroke="#4b565c" stroke-width="2"/>
    <!-- 键臂 -->
    <path d="M604 546 L940 470 L962 480 L640 556 Z" fill="url(#tbrass)"/>
    <path d="M604 546 L940 470" stroke="#f4d79f" stroke-width="2" opacity="0.4"/>
    <!-- 旋钮 -->
    <ellipse cx="954" cy="474" rx="34" ry="22" fill="url(#tbrass)"/>
    <ellipse cx="954" cy="468" rx="26" ry="15" fill="#e8c98e" opacity="0.55"/>
    <!-- 触点 -->
    <rect x="646" y="556" width="26" height="10" rx="2" fill="#8d6a35"/>
    <rect x="700" y="536" width="12" height="22" fill="#2a2118"/>
    <!-- 底座螺丝 -->
    <g fill="#7a848a">
      <circle cx="548" cy="562" r="4"/><circle cx="1012" cy="562" r="4"/>
      <circle cx="548" cy="586" r="4"/><circle cx="1012" cy="586" r="4"/>
    </g>
  </g>

  <!-- 发声器 -->
  <g filter="url(#trough)">
    <rect x="1090" y="430" width="300" height="190" rx="8" fill="#0b1012"/>
    <rect x="1100" y="440" width="280" height="170" rx="6" fill="url(#tsteel)" opacity="0.9"/>
    <rect x="1100" y="440" width="280" height="170" rx="6" fill="none" stroke="#46505a" stroke-width="3"/>
    <rect x="1130" y="470" width="220" height="80" rx="4" fill="#070b0d" stroke="#2b333a" stroke-width="2"/>
    <g stroke="#c79a5f" stroke-width="2" opacity="0.5">
      <path d="M1146 492 H1334"/>
      <path d="M1146 512 H1300"/>
      <path d="M1146 532 H1318"/>
    </g>
    <circle cx="1236" cy="580" r="14" fill="#0e1e2a" stroke="#39434b" stroke-width="2"/>
    <line x1="1236" y1="580" x2="1248" y2="568" stroke="#c79a5f" stroke-width="2"/>
  </g>

  <!-- 纸带 -->
  <g transform="translate(180 620) rotate(-4)">
    <path d="M0 0 H420 L410 74 H-8 Z" fill="#c9b795" opacity="0.78"/>
    <path d="M0 0 H420" stroke="#8a7856" stroke-width="2" opacity="0.6"/>
    <g fill="#241c12" opacity="0.55">
      <circle cx="30" cy="26" r="4"/><circle cx="58" cy="26" r="4"/><circle cx="96" cy="26" r="4"/>
      <circle cx="150" cy="26" r="4"/><circle cx="166" cy="26" r="4"/>
      <circle cx="214" cy="26" r="4"/><circle cx="262" cy="26" r="4"/><circle cx="288" cy="26" r="4"/>
      <circle cx="340" cy="26" r="4"/><circle cx="392" cy="26" r="4"/>
    </g>
    <path d="M-8 74 L410 74" stroke="#4a3f2c" stroke-width="6" opacity="0.5"/>
  </g>

  <!-- 指示灯 -->
  <g>
    <circle cx="420" cy="470" r="16" fill="#2a1c0d" stroke="#5a4524" stroke-width="3"/>
    <circle cx="420" cy="470" r="8" fill="#ffd9a3" opacity="0.85"/>
    <circle cx="420" cy="470" r="70" fill="url(#tlamp)" opacity="0.5"/>
  </g>

  <!-- 暗角 -->
  <rect x="0" y="0" width="1600" height="900" fill="url(#tvign)"/>

  <g pointer-events="none" aria-hidden="true">
    <defs>
      <filter id="fxGrain" x="0" y="0" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency="0.86" numOctaves="3" stitchTiles="stitch" result="n"/>
        <feColorMatrix in="n" type="saturate" values="0"/>
      </filter>
    </defs>
    <rect x="0" y="0" width="1600" height="900" filter="url(#fxGrain)" opacity="0.15" style="mix-blend-mode:overlay"/>
  </g>
</svg>
