<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#0c1a26"/>
      <stop offset="0.6" stop-color="#081119"/>
      <stop offset="1" stop-color="#04080c"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#2a4254"/>
      <stop offset="0.45" stop-color="#182b3a"/>
      <stop offset="1" stop-color="#0a151f"/>
    </linearGradient>
    <linearGradient id="inner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#09141d"/>
      <stop offset="1" stop-color="#040a0f"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffcf94" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#e0a45e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vign" cx="0.5" cy="0.48" r="0.72">
      <stop offset="0.4" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.84"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="20"/></filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <ellipse cx="520" cy="220" rx="620" ry="460" fill="url(#lamp)"/>

  <!-- 墙面 -->
  <g stroke="#0a1620" stroke-width="2" opacity="0.4">
    <line x1="0" y1="180" x2="1600" y2="166"/>
    <line x1="0" y1="640" x2="1600" y2="626"/>
  </g>

  <!-- 投影 -->
  <rect x="370" y="166" width="900" height="600" rx="10" fill="#02060a" opacity="0.85" filter="url(#soft)"/>

  <!-- 保险丝盒外壳 -->
  <g>
    <rect x="360" y="140" width="880" height="620" rx="10" fill="#050d14"/>
    <rect x="376" y="156" width="848" height="588" rx="8" fill="url(#steel)"/>
    <rect x="376" y="156" width="848" height="588" rx="8" fill="none" stroke="#2f4a5f" stroke-width="4"/>

    <!-- 内面板 -->
    <rect x="430" y="208" width="740" height="484" rx="4" fill="url(#inner)" stroke="#1e3345" stroke-width="3"/>

    <!-- 四个保险丝槽 -->
    <g>
      <rect x="492" y="268" width="126" height="300" rx="6" fill="#08131c" stroke="#2f4a5f" stroke-width="3"/>
      <rect x="512" y="300" width="86" height="236" rx="4" fill="#050c12" stroke="#1e3345" stroke-width="2"/>
      <rect x="528" y="318" width="54" height="90" rx="6" fill="#142433" stroke="#3a5670" stroke-width="2"/>
      <rect x="534" y="414" width="42" height="88" rx="5" fill="#0e1c28" stroke="#3a5670" stroke-width="2" opacity="0.6"/>

      <rect x="660" y="268" width="126" height="300" rx="6" fill="#08131c" stroke="#2f4a5f" stroke-width="3"/>
      <rect x="680" y="300" width="86" height="236" rx="4" fill="#050c12" stroke="#1e3345" stroke-width="2"/>
      <rect x="696" y="318" width="54" height="90" rx="6" fill="#142433" stroke="#3a5670" stroke-width="2"/>

      <rect x="828" y="268" width="126" height="300" rx="6" fill="#08131c" stroke="#2f4a5f" stroke-width="3"/>
      <rect x="848" y="300" width="86" height="236" rx="4" fill="#050c12" stroke="#1e3345" stroke-width="2"/>
      <rect x="864" y="318" width="54" height="90" rx="6" fill="#142433" stroke="#3a5670" stroke-width="2"/>

      <!-- 空槽 -->
      <rect x="996" y="268" width="126" height="300" rx="6" fill="#08131c" stroke="#5a4630" stroke-width="3" stroke-dasharray="8 7"/>
      <rect x="1016" y="300" width="86" height="236" rx="4" fill="#03080d" stroke="#3a2f22" stroke-width="2"/>
      <g stroke="#5a4630" stroke-width="3" opacity="0.7">
        <line x1="1030" y1="330" x2="1088" y2="330"/>
        <line x1="1030" y1="500" x2="1088" y2="500"/>
      </g>
    </g>

    <!-- 锈迹与划痕 -->
    <g opacity="0.22">
      <path d="M430 600 Q470 560 520 588 Q560 612 610 586" stroke="#8a5c38" stroke-width="4" fill="none"/>
      <path d="M980 200 Q1010 240 990 280" stroke="#8a5c38" stroke-width="3" fill="none"/>
      <ellipse cx="1140" cy="620" rx="80" ry="26" fill="#6b4528"/>
      <ellipse cx="460" cy="220" rx="60" ry="18" fill="#6b4528"/>
    </g>

    <!-- 螺丝 -->
    <g fill="#1b2c38" stroke="#40607a" stroke-width="2">
      <circle cx="410" cy="190" r="9"/>
      <circle cx="1190" cy="190" r="9"/>
      <circle cx="410" cy="710" r="9"/>
      <circle cx="1190" cy="710" r="9"/>
    </g>

    <!-- 铰链 -->
    <rect x="1222" y="240" width="26" height="86" rx="6" fill="#1b2c38" stroke="#40607a" stroke-width="2"/>
    <rect x="1222" y="470" width="26" height="86" rx="6" fill="#1b2c38" stroke="#40607a" stroke-width="2"/>
  </g>

  <!-- 金属反光 -->
  <path d="M376 156 L520 156 L376 420 Z" fill="#bcd7ee" opacity="0.045"/>
  <path d="M1180 744 L1224 744 L1224 520 Z" fill="#000" opacity="0.18"/>

  <rect width="1600" height="900" fill="url(#vign)"/>
</svg>
