<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#0b1a26"/>
      <stop offset="0.6" stop-color="#081119"/>
      <stop offset="1" stop-color="#04080c"/>
    </linearGradient>
    <linearGradient id="paper" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#d8cdb4"/>
      <stop offset="0.4" stop-color="#b7ab92"/>
      <stop offset="0.75" stop-color="#918871"/>
      <stop offset="1" stop-color="#6d6554"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#0a141c" stop-opacity="0.05"/>
      <stop offset="0.6" stop-color="#0a141c" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#050a0f" stop-opacity="0.72"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffcf94" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#e0a45e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vign" cx="0.5" cy="0.48" r="0.72">
      <stop offset="0.4" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.82"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <ellipse cx="380" cy="160" rx="520" ry="400" fill="url(#lamp)"/>

  <!-- 墙面留白处的一点纹理 -->
  <g stroke="#0a1620" stroke-width="2" opacity="0.4">
    <line x1="0" y1="240" x2="1600" y2="228"/>
    <line x1="0" y1="620" x2="1600" y2="606"/>
  </g>

  <!-- 便条投影 -->
  <path d="M400 190 L1226 202 L1210 760 L420 790 Z" fill="#02060a" opacity="0.82" filter="url(#soft)"/>

  <!-- 便条纸 -->
  <g transform="rotate(-2.2 810 480)">
    <path d="M386 172 L1220 184 L1200 742 L410 772 Z" fill="url(#paper)"/>
    <path d="M386 172 L1220 184 L1200 742 L410 772 Z" fill="url(#shade)"/>
    <path d="M386 172 L1220 184 L1200 742 L410 772 Z" fill="#2a333a" opacity="0.18"/>

    <!-- 纤维与纸纹 -->
    <g stroke="#efe6cf" stroke-width="1" opacity="0.13">
      <path d="M420 280 Q700 272 1000 284"/>
      <path d="M418 356 Q720 348 1030 360"/>
      <path d="M416 432 Q700 424 1010 436"/>
      <path d="M414 508 Q710 500 1020 512"/>
      <path d="M412 584 Q690 576 1000 588"/>
      <path d="M410 660 Q700 652 1010 664"/>
    </g>

    <!-- 纸面（文字由页面层贴合渲染） -->
    <g stroke="#4a4a44" stroke-width="2.2" opacity="0.2" stroke-linecap="round">
      <path d="M470 560 Q620 552 760 562"/>
      <path d="M470 588 Q600 580 720 590"/>
    </g>

    <!-- 折角 -->
    <path d="M1200 742 L1200 660 Q1170 706 1140 742 Z" fill="#7d7461"/>
    <path d="M1200 742 L1200 660 Q1182 704 1140 742 Z" fill="#a89c84" opacity="0.7"/>

    <!-- 卷边阴影 -->
    <path d="M410 772 L1200 742 L1194 758 Q800 790 418 782 Z" fill="#241f19" opacity="0.45"/>

    <!-- 图钉 -->
    <g>
      <circle cx="812" cy="176" r="18" fill="#0a0f13" opacity="0.8"/>
      <circle cx="810" cy="174" r="14" fill="#c9a06a"/>
      <circle cx="805" cy="168" r="5" fill="#f0d5a8" opacity="0.8"/>
    </g>
  </g>

  <rect width="1600" height="900" fill="url(#vign)"/>
  <rect width="1600" height="900" filter="url(#grain)" opacity="0.1" style="mix-blend-mode:overlay"/>
</svg>
