<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#0f2130"/>
      <stop offset="0.55" stop-color="#081119"/>
      <stop offset="1" stop-color="#04080c"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#3a2a20"/>
      <stop offset="0.4" stop-color="#221811"/>
      <stop offset="1" stop-color="#0e0a07"/>
    </linearGradient>
    <linearGradient id="inner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a141c"/>
      <stop offset="1" stop-color="#050a0f"/>
    </linearGradient>
    <linearGradient id="tape" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#26404f"/>
      <stop offset="0.5" stop-color="#16283a"/>
      <stop offset="1" stop-color="#0b1620"/>
    </linearGradient>
    <linearGradient id="tape2" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#4a3a2a"/>
      <stop offset="0.55" stop-color="#2d2318"/>
      <stop offset="1" stop-color="#140f0a"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd6a0" stop-opacity="0.44"/>
      <stop offset="0.5" stop-color="#e0a45e" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#e0a45e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vign" cx="0.5" cy="0.46" r="0.72">
      <stop offset="0.38" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.82"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.84" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <ellipse cx="300" cy="120" rx="480" ry="380" fill="url(#lamp)"/>

  <!-- 柜体 -->
  <g>
    <path d="M170 60 L1430 48 L1430 860 L170 868 Z" fill="#05090d"/>
    <path d="M182 74 L1418 62 L1418 846 L182 856 Z" fill="url(#inner)"/>
    <!-- 柜门（敞开，左右两边露出一角） -->
    <path d="M0 20 L170 60 L170 868 L0 900 Z" fill="url(#wood)"/>
    <path d="M1430 48 L1600 14 L1600 900 L1430 860 Z" fill="url(#wood)"/>

    <!-- 隔板 -->
    <g>
      <rect x="182" y="300" width="1236" height="18" fill="#20415a" opacity="0.45"/>
      <rect x="182" y="300" width="1236" height="4" fill="#3a6a8c" opacity="0.5"/>
      <rect x="182" y="560" width="1236" height="18" fill="#20415a" opacity="0.4"/>
      <rect x="182" y="560" width="1236" height="4" fill="#3a6a8c" opacity="0.45"/>

      <!-- 上层：磁带 -->
      <g>
        <rect x="216" y="196" width="132" height="104" rx="3" fill="url(#tape)"/>
        <rect x="360" y="200" width="132" height="100" rx="3" fill="url(#tape2)"/>
        <rect x="504" y="192" width="132" height="108" rx="3" fill="url(#tape)"/>
        <rect x="648" y="202" width="132" height="98" rx="3" fill="#101d29"/>
        <rect x="792" y="194" width="132" height="106" rx="3" fill="url(#tape2)"/>
        <rect x="936" y="200" width="132" height="100" rx="3" fill="url(#tape)"/>
        <rect x="1080" y="196" width="132" height="104" rx="3" fill="#0d1a26"/>
        <!-- 空位（标签被撕掉） -->
        <rect x="1224" y="198" width="132" height="102" rx="3" fill="#050b11" stroke="#28445c" stroke-dasharray="7 7"/>
        <!-- 磁带窗口与标签 -->
        <g fill="#0a151f">
          <rect x="250" y="228" width="64" height="34" rx="2"/>
          <rect x="394" y="232" width="64" height="32" rx="2"/>
          <rect x="538" y="224" width="64" height="34" rx="2"/>
          <rect x="682" y="234" width="64" height="32" rx="2"/>
          <rect x="826" y="226" width="64" height="34" rx="2"/>
          <rect x="970" y="232" width="64" height="32" rx="2"/>
          <rect x="1114" y="228" width="64" height="34" rx="2"/>
        </g>
        <g fill="#c39a63" opacity="0.3">
          <rect x="228" y="212" width="52" height="10"/>
          <rect x="372" y="216" width="52" height="10"/>
          <rect x="516" y="208" width="52" height="10"/>
          <rect x="660" y="218" width="52" height="10"/>
          <rect x="804" y="210" width="52" height="10"/>
          <rect x="948" y="216" width="52" height="10"/>
          <rect x="1092" y="212" width="52" height="10"/>
        </g>
        <!-- 高光 -->
        <g fill="#8fb9d4" opacity="0.1">
          <rect x="218" y="198" width="128" height="6"/>
          <rect x="362" y="202" width="128" height="6"/>
          <rect x="506" y="194" width="128" height="6"/>
          <rect x="794" y="196" width="128" height="6"/>
          <rect x="938" y="202" width="128" height="6"/>
        </g>
      </g>

      <!-- 中层：纸堆与值班手册 -->
      <g transform="rotate(-1.5 800 430)">
        <!-- 一摞纸 -->
        <g>
          <rect x="244" y="396" width="424" height="158" rx="2" fill="#0a1118"/>
          <rect x="250" y="402" width="420" height="150" fill="#8d8069" opacity="0.42"/>
          <g fill="#726954" opacity="0.6">
            <rect x="252" y="408" width="414" height="4"/>
            <rect x="252" y="418" width="410" height="3"/>
            <rect x="254" y="430" width="408" height="3"/>
            <rect x="254" y="540" width="404" height="4"/>
          </g>
          <rect x="250" y="402" width="420" height="150" fill="#132029" opacity="0.55"/>
          <path d="M250 402 L670 402 L660 552 L250 552 Z" fill="none" stroke="#6d6450" stroke-width="1.6" opacity="0.6"/>
          <g stroke="#5b5442" stroke-width="1.4" opacity="0.28">
            <path d="M270 438 L640 438"/>
            <path d="M270 468 L620 468"/>
            <path d="M270 498 L648 498"/>
            <path d="M270 526 L596 526"/>
          </g>
          <!-- 纸边缘高光 -->
          <path d="M252 404 L668 404" stroke="#d8cdb4" stroke-width="1.6" opacity="0.3"/>
        </g>

        <!-- 值班手册 -->
        <g>
          <rect x="686" y="434" width="308" height="124" rx="3" fill="#05101a"/>
          <rect x="692" y="440" width="300" height="112" rx="2" fill="#16232d"/>
          <rect x="692" y="440" width="300" height="112" rx="2" fill="#7d93a3" opacity="0.08"/>
          <rect x="692" y="440" width="300" height="112" rx="2" fill="none" stroke="#3d5468" stroke-width="2" opacity="0.8"/>
          <rect x="692" y="440" width="300" height="12" fill="#28445c" opacity="0.55"/>
          <!-- 装订环 -->
          <g fill="#4a6478" opacity="0.75">
            <circle cx="700" cy="464" r="6"/>
            <circle cx="700" cy="496" r="6"/>
            <circle cx="700" cy="528" r="6"/>
          </g>
          <!-- 标签贴纸 -->
          <rect x="726" y="470" width="96" height="54" rx="2" fill="#b7a98c" opacity="0.55"/>
          <rect x="726" y="470" width="96" height="54" rx="2" fill="#132029" opacity="0.25"/>
          <g stroke="#4a4335" stroke-width="1.6" opacity="0.45">
            <path d="M736 486 L812 486"/>
            <path d="M736 500 L800 500"/>
            <path d="M736 512 L790 512"/>
          </g>
          <!-- 书页侧边 -->
          <path d="M692 552 L992 552 L992 560 L692 560 Z" fill="#8f846c" opacity="0.4"/>
        </g>
      </g>

      <!-- 下层：旧设备与线缆 -->
      <g>
        <rect x="240" y="620" width="300" height="180" rx="4" fill="#0b1724"/>
        <rect x="240" y="620" width="300" height="180" rx="4" fill="none" stroke="#28445c" stroke-width="2"/>
        <circle cx="316" cy="700" r="30" fill="#132434" stroke="#2e4a60" stroke-width="2"/>
        <circle cx="316" cy="700" r="7" fill="#3a5670"/>
        <circle cx="410" cy="700" r="30" fill="#132434" stroke="#2e4a60" stroke-width="2"/>
        <circle cx="410" cy="700" r="7" fill="#3a5670"/>
        <rect x="270" y="756" width="240" height="8" rx="4" fill="#16283a"/>
        <path d="M620 760 Q760 726 880 764 Q980 796 1090 770"
              stroke="#0a141f" stroke-width="7" fill="none" opacity="0.9"/>
        <path d="M620 760 Q760 726 880 764 Q980 796 1090 770"
              stroke="#28445c" stroke-width="2" fill="none" opacity="0.5"/>
      </g>
    </g>

    <!-- 柜内暖光与灰尘 -->
    <ellipse cx="700" cy="440" rx="520" ry="320" fill="url(#lamp)" opacity="0.6"/>
    <g fill="#ffe6bd" opacity="0.34">
      <circle cx="420" cy="360" r="2.4"/>
      <circle cx="560" cy="470" r="1.8"/>
      <circle cx="760" cy="392" r="2"/>
      <circle cx="980" cy="452" r="2.6"/>
      <circle cx="1120" cy="368" r="1.6"/>
      <circle cx="680" cy="600" r="2.2"/>
      <circle cx="880" cy="640" r="1.8"/>
    </g>
  </g>

  <rect width="1600" height="900" fill="url(#vign)"/>
  <rect width="1600" height="900" filter="url(#grain)" opacity="0.09" style="mix-blend-mode:overlay"/>
</svg>
