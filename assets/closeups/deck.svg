  <g>
    <rect x="1130" y="300" width="150" height="96" rx="8" fill="url(#dvu)" stroke="#3f5f6d" stroke-width="3"/>
    <path d="M1150 380 Q1205 314 1260 380" fill="none" stroke="#9db6c4" stroke-width="2" opacity="0.7"/>
    <g stroke="#7f97a6" stroke-width="2" opacity="0.6">
      <line x1="1162" y1="376" x2="1166" y2="364"/>
      <line x1="1186" y1="348" x2="1190" y2="338"/>
      <line x1="1224" y1="342" x2="1228" y2="332"/>
      <line x1="1250" y1="360" x2="1254" y2="350"/>
    </g>
    <line x1="1205" y1="378" x2="1240" y2="330" stroke="#e0a45e" stroke-width="3"/>
    <circle cx="1205" cy="378" r="5" fill="#e0a45e"/>
  </g>

  <!-- 运输按键 -->
  <g>
    <rect x="300" y="664" width="96" height="62" rx="8" fill="#16242e" stroke="#3f5f6d" stroke-width="3"/>
    <rect x="418" y="664" width="96" height="62" rx="8" fill="#16242e" stroke="#3f5f6d" stroke-width="3"/>
    <rect x="536" y="664" width="96" height="62" rx="8" fill="#16242e" stroke="#3f5f6d" stroke-width="3"/>
    <rect x="654" y="664" width="96" height="62" rx="8" fill="#16242e" stroke="#3f5f6d" stroke-width="3"/>
    <!-- 倒带 / 播放 / 停止 / 录音 -->
    <path d="M372 682 L372 708 L348 695 Z" fill="#b9cede"/>
    <path d="M372 682 L372 708 L396 695 Z" fill="#b9cede"/>
    <path d="M490 682 L490 708 L514 695 Z" fill="#ffd9a4"/>
    <rect x="560" y="686" width="22" height="22" fill="#b9cede"/>
    <circle cx="702" cy="695" r="13" fill="#a8452f"/>
  </g>

  <!-- 走带计数器 -->
  <g>
    <rect x="800" y="664" width="230" height="62" rx="8" fill="#0b141b" stroke="#33505f" stroke-width="3"/>
    <g fill="#e0a45e" font-family="monospace" font-size="42" opacity="0.85">
      <text x="826" y="710">0</text>
      <text x="874" y="710">4</text>
      <text x="922" y="710">7</text>
      <text x="970" y="710">2</text>
    </g>
  </g>

  <!-- 铭牌 -->
  <rect x="1086" y="664" width="228" height="62" rx="6" fill="#1b2b36" stroke="#3d5b6c" stroke-width="2"/>
  <g stroke="#8ea6b6" stroke-width="2" opacity="0.45">
    <line x1="1106" y1="686" x2="1290" y2="686"/>
    <line x1="1106" y1="704" x2="1250" y2="704"/>
  </g>

  <rect width="1600" height="900" fill="url(#dvign)"/>
</svg>
