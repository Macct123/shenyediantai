<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#122430"/>
      <stop offset="0.55" stop-color="#0a131b"/>
      <stop offset="1" stop-color="#04080c"/>
    </linearGradient>
    <linearGradient id="kraft" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#cdb894"/>
      <stop offset="0.35" stop-color="#b09a76"/>
      <stop offset="0.72" stop-color="#8a7455"/>
      <stop offset="1" stop-color="#65533c"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#0b141b" stop-opacity="0.04"/>
      <stop offset="0.55" stop-color="#0b141b" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#05090d" stop-opacity="0.78"/>
    </linearGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#131f26"/>
      <stop offset="1" stop-color="#060c11"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd6a0" stop-opacity="0.42"/>
      <stop offset="0.5" stop-color="#e0a45e" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#e0a45e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="stamp" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#8d5f57"/>
      <stop offset="1" stop-color="#4b2f2b"/>
    </radialGradient>
    <radialGradient id="vign" cx="0.5" cy="0.46" r="0.72">
      <stop offset="0.42" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.8"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="20"/></filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="0" y="560" width="1600" height="340" fill="url(#desk)"/>
  <path d="M0 560 Q800 540 1600 566 L1600 900 L0 900 Z" fill="#0b141a" opacity="0.6"/>
  <ellipse cx="330" cy="150" rx="520" ry="400" fill="url(#lamp)"/>

  <!-- 信封投影 -->
  <path d="M300 250 L1330 208 L1400 700 L352 754 Z" fill="#02060a" opacity="0.85" filter="url(#soft)"/>

  <!-- 信封 -->
  <g transform="rotate(-2 830 470)">
    <path d="M286 236 L1322 194 L1392 686 L338 740 Z" fill="url(#kraft)"/>
    <path d="M286 236 L1322 194 L1392 686 L338 740 Z" fill="url(#shade)"/>

    <!-- 纸纹 -->
    <g stroke="#e6d6b6" stroke-width="1" opacity="0.1">
      <path d="M320 300 Q800 280 1300 258"/>
      <path d="M326 380 Q800 360 1308 338"/>
      <path d="M332 460 Q800 440 1316 418"/>
      <path d="M338 540 Q800 520 1324 498"/>
      <path d="M344 620 Q800 600 1332 578"/>
    </g>

    <!-- 封盖 -->
    <path d="M286 236 L1322 194 L820 540 Z" fill="#c2ad8a" opacity="0.6"/>
    <path d="M286 236 L1322 194 L820 540 Z" fill="#0a141b" opacity="0.22"/>
    <path d="M286 236 L1322 194 L820 540 Z" fill="none" stroke="#7a6547" stroke-width="2" opacity="0.5"/>
    <path d="M300 244 L819 534 L1306 205" stroke="#8d7654" stroke-width="1.2" fill="none" opacity="0.5"/>

    <!-- 折痕 -->
    <path d="M338 740 L820 540 L1392 686" stroke="#6d5a3e" stroke-width="2.4" fill="none" opacity="0.4"/>
    <path d="M820 540 L822 742" stroke="#6d5a3e" stroke-width="1.6" fill="none" opacity="0.22"/>

    <!-- 邮戳 -->
    <g transform="translate(1180 300) rotate(-12)">
      <circle r="82" fill="none" stroke="#7d4b44" stroke-width="6" opacity="0.5"/>
      <circle r="64" fill="none" stroke="#7d4b44" stroke-width="3" opacity="0.36"/>
      <g stroke="#7d4b44" stroke-width="4" opacity="0.32">
        <path d="M-100 -18 Q-70 -26 -40 -18"/>
        <path d="M-100 12 Q-68 4 -36 12"/>
        <path d="M-100 42 Q-72 34 -44 42"/>
      </g>
    </g>

    <!-- 邮票 -->
    <rect x="1150" y="196" width="126" height="96" rx="4" fill="url(#stamp)" transform="rotate(6 1213 244)"/>
    <rect x="1150" y="196" width="126" height="96" rx="4" fill="none" stroke="#2c1b19" stroke-width="2" transform="rotate(6 1213 244)"/>
    <g stroke="#e8dcc4" stroke-width="2" opacity="0.22" transform="rotate(6 1213 244)">
      <path d="M1170 240 Q1200 218 1240 232"/>
      <path d="M1170 262 Q1210 246 1256 258"/>
    </g>
    <!-- 齿孔 -->
    <g fill="#0a1219" opacity="0.55">
      <circle cx="1160" cy="192" r="4"/><circle cx="1184" cy="191" r="4"/>
      <circle cx="1208" cy="190" r="4"/><circle cx="1232" cy="189" r="4"/>
      <circle cx="1256" cy="188" r="4"/>
    </g>

    <!-- 边角磨损 -->
    <path d="M286 236 Q300 250 312 246" stroke="#e0cfae" stroke-width="2" fill="none" opacity="0.4"/>
    <path d="M338 740 Q360 736 376 726" stroke="#e0cfae" stroke-width="2" fill="none" opacity="0.3"/>
    <path d="M1392 686 Q1370 690 1352 700" stroke="#2a2018" stroke-width="2" fill="none" opacity="0.4"/>
  </g>

  <rect width="1600" height="900" fill="url(#vign)"/>
  <rect width="1600" height="900" filter="url(#grain)" opacity="0.09" style="mix-blend-mode:overlay"/>
</svg>
