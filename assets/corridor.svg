    <rect x="60" y="208" width="248" height="688" fill="none" stroke="#22394d" stroke-width="4"/>
    <rect x="86" y="240" width="196" height="250" fill="#08131c" stroke="#1a2c3d" stroke-width="3"/>
    <rect x="86" y="522" width="196" height="330" fill="#08131c" stroke="#1a2c3d" stroke-width="3"/>
    <circle cx="274" cy="580" r="12" fill="#2a4055" stroke="#40607a" stroke-width="2"/>
    <circle cx="274" cy="580" r="4" fill="#c79a5f" opacity="0.7"/>
