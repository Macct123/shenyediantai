    <rect x="1244" y="294" width="216" height="496" fill="none" stroke="#2a4055" stroke-width="3"/>
    <path d="M1244 420 L1460 420 M1244 546 L1460 546 M1244 672 L1460 672" stroke="#0a151f" stroke-width="5"/>
