  <!-- 雨靴 -->
  <g>
    <ellipse cx="307" cy="892" rx="76" ry="18" fill="#04090e" opacity="0.6"/>
    <path d="M258 800 Q258 778 276 776 L296 776 Q310 776 312 792 L314 856 Q336 860 338 878 L338 890 L256 890 L256 846 Z" fill="#0d1a23" stroke="#243c4b" stroke-width="2"/>
    <path d="M330 790 Q330 770 348 768 L368 768 Q382 768 384 784 L386 852 Q408 856 410 874 L410 888 L328 888 L328 838 Z" fill="#0f1d27" stroke="#243c4b" stroke-width="2"/>
    <path d="M262 812 Q286 806 310 812" fill="none" stroke="#2a4050" stroke-width="2" opacity="0.7"/>
    <path d="M334 802 Q358 796 382 802" fill="none" stroke="#2a4050" stroke-width="2" opacity="0.7"/>
    <rect x="246" y="884" width="176" height="14" rx="4" fill="#101c24"/>
