      <rect x="1394" y="640" width="34" height="30" rx="3" fill="#1b2c38" stroke="#40607a" stroke-width="2"/>
      <path d="M1402 640 L1402 628 Q1411 616 1420 628 L1420 640" fill="none" stroke="#40607a" stroke-width="3"/>
