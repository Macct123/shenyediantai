      <line x1="1262" y1="334" x2="1442" y2="334"/>
      <line x1="1262" y1="346" x2="1442" y2="346"/>
      <line x1="1262" y1="358" x2="1442" y2="358"/>
      <line x1="1262" y1="370" x2="1442" y2="370"/>
      <line x1="1262" y1="382" x2="1442" y2="382"/>
    </g>
    <rect x="1424" y="430" width="8" height="54" rx="4" fill="#2a4055"/>
    <rect x="1424" y="556" width="8" height="54" rx="4" fill="#2a4055"/>
