    <rect x="1566" y="184" width="252" height="236" fill="#050a11"/>
    <rect x="1572" y="190" width="240" height="224" fill="#0c1b28" stroke="#1a2c3d" stroke-width="5"/>
    <g clip-path="url(#cwinClip)">
