  <!-- 吊灯 -->
  <g>
    <line x1="998" y1="0" x2="998" y2="132" stroke="#0a141c" stroke-width="4"/>
    <path d="M944 132 L1052 132 L1036 176 L960 176 Z" fill="#12222e"/>
    <path d="M960 176 L1036 176 L1036 182 L960 182 Z" fill="#2b4a66" opacity="0.7"/>
