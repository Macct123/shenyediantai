    <rect x="1030" y="700" width="150" height="16" fill="#c9bda6" opacity="0.72" transform="rotate(2 1030 700)"/>
    <g stroke="#3d4f5c" stroke-width="1.4" opacity="0.55" transform="rotate(2 1030 700)">
      <line x1="1046" y1="706" x2="1164" y2="706"/>
      <line x1="1046" y1="712" x2="1150" y2="712"/>
