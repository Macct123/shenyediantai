    <rect x="432" y="374" width="188" height="206" fill="#1b3244"/>
    <rect x="432" y="374" width="188" height="206" fill="url(#cpaper)" opacity="0.3"/>
    <rect x="432" y="374" width="188" height="206" fill="#0f2231" opacity="0.42"/>
    <g stroke="#8fb4c9" stroke-width="0.9" opacity="0.28">
