      <rect x="1578" y="300" width="228" height="2" fill="#2a5372" opacity="0.5"/>
      <path d="M1600 306 Q1640 300 1680 304 Q1720 308 1760 302 L1806 306 L1806 408 L1578 408 Z" fill="#081420" opacity="0.9"/>
