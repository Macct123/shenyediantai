    <line x1="700" y1="646" x2="700" y2="900"/>
    <line x1="1060" y1="646" x2="1060" y2="900"/>
    <line x1="1420" y1="646" x2="1420" y2="900"/>
  </g>

  <!-- 地板 -->
  <rect x="-20" y="892" width="1960" height="200" fill="url(#cwood)" filter="url(#cpaint)"/>
  <rect x="0" y="892" width="1920" height="4" fill="#2a4054" opacity="0.5"/>
  <g stroke="#050b11" stroke-width="2" opacity="0.55">
    <path d="M0 940 Q480 934 960 944 Q1440 954 1920 938"/>
    <path d="M0 1000 Q520 992 1040 1004 Q1500 1016 1920 996"/>
    <path d="M0 1058 Q460 1050 920 1062 Q1400 1074 1920 1054"/>
  </g>

