    <rect x="966" y="716" width="316" height="22" fill="#1b2b33"/>
    <rect x="966" y="716" width="316" height="5" fill="#33505f" opacity="0.6"/>
    <rect x="986" y="738" width="16" height="158" fill="#0a141c"/>
    <rect x="1246" y="738" width="16" height="158" fill="#0a141c"/>
