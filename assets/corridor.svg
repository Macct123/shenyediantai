    <path d="M700 300 Q730 420 706 560" stroke="#5c7b8c" stroke-width="3" fill="none"/>
    <path d="M1540 500 Q1560 560 1546 630" stroke="#5c7b8c" stroke-width="2" fill="none"/>
    <ellipse cx="1180" cy="250" rx="90" ry="44" fill="#080f16"/>
    <ellipse cx="380" cy="520" rx="70" ry="36" fill="#080f16"/>
