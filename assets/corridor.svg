<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="none">
  <defs>
    <linearGradient id="cwall" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#101f2c"/>
      <stop offset="0.48" stop-color="#0b1823"/>
      <stop offset="1" stop-color="#060e16"/>
    </linearGradient>
    <linearGradient id="cwood" x1="0" y1="0" x2="0.1" y2="1">
      <stop offset="0" stop-color="#1b2a31"/>
      <stop offset="0.3" stop-color="#131f26"/>
      <stop offset="1" stop-color="#070d12"/>
    </linearGradient>
    <linearGradient id="cmetal" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#243A4C"/>
      <stop offset="0.5" stop-color="#172A3A"/>
      <stop offset="1" stop-color="#0A151F"/>
    </linearGradient>
    <linearGradient id="cpaper" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#c9bda6"/>
      <stop offset="1" stop-color="#8f8069"/>
    </linearGradient>
    <linearGradient id="cdoor" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#1a2b36"/>
      <stop offset="0.6" stop-color="#0f1c25"/>
      <stop offset="1" stop-color="#070e14"/>
    </linearGradient>
    <linearGradient id="csea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16334c"/>
      <stop offset="0.5" stop-color="#0e2233"/>
      <stop offset="1" stop-color="#081520"/>
    </linearGradient>
    <radialGradient id="cbulb" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe6bd" stop-opacity="0.95"/>
      <stop offset="0.22" stop-color="#f0b877" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#e0a45e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cpool" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e0a45e" stop-opacity="0.22"/>
      <stop offset="0.62" stop-color="#c98a4a" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#c98a4a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cvign" cx="0.5" cy="0.46" r="0.76">
      <stop offset="0.4" stop-color="#000" stop-opacity="0"/>
      <stop offset="0.78" stop-color="#000" stop-opacity="0.36"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.82"/>
    </radialGradient>
    <filter id="cpaint" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.008 0.018" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="15" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="cpaint2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.016 0.03" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="7" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="cblurS"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="cblurL"><feGaussianBlur stdDeviation="22"/></filter>
    <clipPath id="cwinClip"><rect x="1578" y="196" width="228" height="212" rx="3"/></clipPath>
  </defs>

  <!-- 墙 -->
  <rect x="-40" y="-40" width="2000" height="1180" fill="url(#cwall)" filter="url(#cpaint)"/>
  <rect x="-40" y="-40" width="2000" height="1180" fill="#1a3346" opacity="0.1" filter="url(#cpaint2)"/>

  <!-- 护墙板 -->
  <rect x="-20" y="640" width="1960" height="270" fill="#0a141d" opacity="0.55"/>
  <rect x="-20" y="636" width="1960" height="10" fill="#22394d" opacity="0.45"/>
  <g stroke="#050b11" stroke-width="3" opacity="0.6">
